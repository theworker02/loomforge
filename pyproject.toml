[project]
name = "loomforge"
version = "0.1.0"
description = "Simulation-led engineering prototype for LoomForge"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "theworker02 and Magnexis"}]
keywords = ["engineering", "simulation", "wire-harness", "connector", "manufacturing"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Manufacturing",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering"
]

[project.urls]
Homepage = "https://github.com/theworker02/loomforge"
Repository = "https://github.com/theworker02/loomforge"

[project.scripts]
loomforge = "loomforge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "software/backend"}

[tool.setuptools.packages.find]
where = ["software/backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
